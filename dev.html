<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Developer · Coptic Feast Calendar</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#7b1e2b">
<style>
  :root { --bg:#f7f2ea; --card:#fffdf9; --ink:#2a1f1a; --muted:#7a6a5f; --line:#e8dccd; --accent:#7b1e2b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17120f; --card:#211a16; --ink:#f2e9df; --muted:#a8988a; --line:#3a2f28; --accent:#d8707d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 40px; }
  a { color:var(--accent); }
  h1 { font-size:24px; margin:8px 0 4px; }
  .m { color:var(--muted); font-size:13.5px; margin:0 0 14px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=password] { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .row span { color:var(--muted); font-size:13.5px; }
  button { padding:11px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); padding:6px 0; font-weight:500; }
  .err { color:#b3261e; font-size:13.5px; margin-top:10px; }
  iframe { width:100%; border:0; border-radius:16px; display:block; min-height:400px; background:#f7f2ea; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:0 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <a href="./">← Back to the calendar</a>
  <h1>Developer</h1>
  <p class="m">Private stats for the Coptic Feast Calendar.</p>

  <form id="login" autocomplete="on">
    <!-- Hidden username so iPhone Passwords can save and autofill this -->
    <input type="text" name="username" autocomplete="username" value="coptic-calendar-stats" hidden readonly>
    <label for="pw">Password</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required>
    <div class="row">
      <span><input type="checkbox" id="remember" checked> <label for="remember" style="display:inline;font-weight:400">Remember on this device</label></span>
      <button type="submit" id="go">Open stats</button>
    </div>
    <div class="err" id="err" hidden></div>
  </form>

  <div id="out" hidden>
    <div class="bar"><button class="ghost" id="refresh" type="button">Refresh</button><button class="ghost" id="logout" type="button">Sign out</button></div>
    <iframe id="frame" title="Stats"></iframe>
  </div>
</div>
<script src="config.js"></script>
<script>
(function () {
  const API = ((window.CFC_CONFIG && window.CFC_CONFIG.api) || "").replace(/\/+$/, "");
  const $ = (id) => document.getElementById(id);
  const store = { get() { try { return localStorage.getItem("cfc-dev") || ""; } catch (e) { return ""; } },
    set(v) { try { v ? localStorage.setItem("cfc-dev", v) : localStorage.removeItem("cfc-dev"); } catch (e) {} } };
  let key = "";

  function fail(msg) { $("err").textContent = msg; $("err").hidden = false; $("login").hidden = false; $("out").hidden = true; $("go").disabled = false; $("go").textContent = "Open stats"; }

  async function open(k) {
    if (!API) return fail("The server address isn't set in config.js.");
    $("go").disabled = true; $("go").textContent = "Opening…"; $("err").hidden = true;
    try {
      const res = await fetch(API + "/stats", { headers: { "X-Stats-Key": k }, cache: "no-store" });
      if (res.status === 404) { store.set(""); return fail("Wrong password."); }
      if (!res.ok) return fail("The server returned an error (" + res.status + ").");
      key = k;
      if ($("remember").checked) store.set(k);
      const f = $("frame");
      f.onload = () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch (e) { f.style.height = "85vh"; } };
      f.srcdoc = await res.text();
      $("login").hidden = true; $("out").hidden = false;
    } catch (e) { fail("Couldn't reach the server. Check your connection and try again."); }
  }

  $("login").addEventListener("submit", (e) => { e.preventDefault(); open($("pw").value.trim()); });
  $("refresh").onclick = () => open(key);
  $("logout").onclick = () => { store.set(""); key = ""; $("pw").value = ""; $("out").hidden = true; $("login").hidden = false; $("go").disabled = false; $("go").textContent = "Open stats"; };

  const saved = store.get();
  if (saved) open(saved);
})();
</script>
</body>
</html>
